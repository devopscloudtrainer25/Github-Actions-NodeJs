name: Github Actions with Matrix

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node Js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Run NPM CI
        run: npm ci
      - name: RUN NPM test
        run: npm test
